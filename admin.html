<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1A1B20">
<title>Bisaya Toolkit Rewards Admin</title>
<style>
:root{--bg:#1A1B20;--card:#202127;--inner:#17181C;--line:#34363B;--green:#7CCB69;--green2:#91DA7B;--text:#fff;--muted:#A7A9AE;--red:#ff7575}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.app{width:min(980px,100%);margin:auto;padding:18px 14px 40px}
.top,.card{background:var(--card);border:1px solid #303238;border-radius:18px;padding:16px;margin-bottom:12px}
h1{font-size:22px;margin:0}p{font-size:12px;color:var(--muted);line-height:1.5}
.login{display:flex;gap:8px;margin-top:12px}.field{height:44px;flex:1;background:var(--inner);border:1px solid #3B3D44;border-radius:12px;color:#fff;padding:0 12px;outline:none}
.btn{height:44px;border:0;border-radius:12px;padding:0 15px;font-weight:800}.green{background:var(--green);color:#10120F}.dark{background:#292B31;color:#fff;border:1px solid #3B3D44}.red{background:#422324;color:#ff9898;border:1px solid #6d3436}
.filters{display:flex;gap:7px;flex-wrap:wrap}.filter{height:36px;border-radius:999px;background:var(--inner);color:var(--muted);border:1px solid #3B3D44;padding:0 13px}.filter.active{color:var(--green);border-color:var(--green);background:#243624}
.entry{background:var(--inner);border:1px solid #32343A;border-radius:14px;padding:14px;margin-top:9px}.head{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}.name{font-size:14px;font-weight:900}.sub{font-size:10px;color:var(--green);margin-top:3px}.status{font-size:9px;font-weight:900;text-transform:uppercase;border-radius:999px;padding:5px 8px;background:#342f21;color:#f4c95d}.status.approved{background:#203722;color:var(--green2)}.status.rejected{background:#3a2020;color:#ff8a8a}
.url{display:block;color:#c7d9c4;font-size:11px;margin-top:10px;word-break:break-all}.grid{display:grid;grid-template-columns:1fr 110px 110px;gap:8px;margin-top:12px}.small{width:100%;height:40px;background:#202127;border:1px solid #3B3D44;border-radius:10px;color:#fff;padding:0 10px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.actions .btn{height:38px;font-size:11px}
.empty{text-align:center;color:#777a80;padding:28px 10px}.meta{font-size:10px;color:#777a80;margin-top:8px}.hidden{display:none!important}
@media(max-width:600px){.grid{grid-template-columns:1fr}.login{flex-direction:column}}

.eventbox{margin-top:12px;background:#17181C;border:1px solid #32343A;border-radius:14px;padding:14px}
.eventgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.switchrow{display:flex;align-items:center;gap:8px;margin-top:10px;color:#A7A9AE;font-size:12px}
.winnerbtn{background:#2b3d23;color:#91DA7B;border:1px solid #4f7242}
.deletebtn{background:#361d1d;color:#ff9292;border:1px solid #633030}
.private{font-size:10px;color:#d0b77a;margin-top:8px;line-height:1.55}
@media(max-width:600px){.eventgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <section class="top">
    <h1>Bisaya Toolkit Rewards Admin</h1>
    <p>Review TikTok submissions, approve/reject entries, set rewards, and assign leaderboard scores.</p>
    <div class="login">
      <input id="adminKey" class="field" type="password" placeholder="Admin key">
      <button id="loadBtn" class="btn green">LOAD ENTRIES</button>
    </div>

    <div class="eventbox">
      <div class="name">Event Countdown Dialog</div>
      <div class="sub">Control the live countdown shown to users.</div>

      <label class="switchrow">
        <input id="countdownEnabled" type="checkbox">
        Show countdown dialog
      </label>

      <div class="eventgrid">
        <input id="countdownTitleInput" class="small" placeholder="Dialog title" value="Event Starts Soon">
        <input id="countdownStart" class="small" type="datetime-local">
      </div>

      <input id="countdownMessageInput" class="small" style="margin-top:8px" placeholder="Countdown message" value="Get ready for the next Bisaya Toolkit rewards event!">

      <div class="actions">
        <button id="saveEventBtn" class="btn green">SAVE COUNTDOWN</button>
        <button id="loadEventBtn" class="btn dark">LOAD CURRENT</button>
      </div>
    </div>
  </section>

  <section id="panel" class="card hidden">
    <div class="filters">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="pending">Pending</button>
      <button class="filter" data-filter="approved">Approved</button>
      <button class="filter" data-filter="rejected">Rejected</button>
    </div>
    <div id="entries"></div>
  </section>
</div>

<script>
let DATA=[];
let FILTER="all";
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");

function key(){return $("adminKey").value.trim()}
function statusClass(v){return v==="approved"?"approved":v==="rejected"?"rejected":""}

async function loadEntries(){
  if(!key()){alert("Enter the admin key.");return}

  $("loadBtn").disabled=true;
  $("loadBtn").textContent="LOADING...";

  try{
    const r=await fetch("/api/rewards/admin/list",{headers:{"X-Admin-Key":key()},cache:"no-store"});
    const j=await r.json();

    if(!r.ok)throw new Error(j.error||"Unable to load");

    DATA=j.entries||[];
    $("panel").classList.remove("hidden");
    render();
  }catch(e){
    alert(e.message);
  }finally{
    $("loadBtn").disabled=false;
    $("loadBtn").textContent="LOAD ENTRIES";
  }
}

function render(){
  const items=DATA.filter(x=>FILTER==="all"||x.status===FILTER);

  if(!items.length){
    $("entries").innerHTML='<div class="empty">No entries in this filter.</div>';
    return;
  }

  $("entries").innerHTML=items.map(x=>`
    <div class="entry" data-id="${esc(x.submission_id)}">
      <div class="head">
        <div>
          <div class="name">@${esc(x.tiktok_username)}</div>
          <div class="sub">${esc(x.content_type)} • ${esc(x.submission_id)}</div>
        </div>
        <span class="status ${statusClass(x.status)}">${esc(x.status)}</span>
      </div>

      <a class="url" href="${esc(x.tiktok_url)}" target="_blank">${esc(x.tiktok_url)}</a>
      <div class="meta">${new Date(x.submitted_at||0).toLocaleString()}</div>

      <div class="private">
        Preferred reward: <b>${esc(x.reward_choice||"")}</b><br>
        ${x.reward_choice==="Cash"
          ? `${esc(x.payout_method||"Cash")}: <b>${esc(x.payout_account||"")}</b>`
          : `MLBB ID: <b>${esc(x.mlbb_id||"")}</b> • Server: <b>${esc(x.mlbb_server||"")}</b>`}
        ${x.is_winner ? `<br>🏆 Announced winner: <b>${esc(x.winner_reward||x.reward||"")}</b>` : ""}
      </div>

      <div class="grid">
        <input class="small note" placeholder="Review note" value="${esc(x.review_note||"")}">
        <input class="small reward" placeholder="Reward / admin note reward" value="${esc(x.reward||"")}">
        <input class="small score" type="number" min="0" placeholder="Score" value="${Number(x.score||0)}">
        <input class="small winnerreward" placeholder="Winner reward e.g. 500 Diamonds / ₱500" value="${esc(x.winner_reward||"")}">
      </div>

      <div class="actions">
        <button class="btn green" onclick="review('${esc(x.submission_id)}','approve')">APPROVE</button>
        <button class="btn red" onclick="review('${esc(x.submission_id)}','reject')">REJECT</button>
        <button class="btn dark" onclick="review('${esc(x.submission_id)}','pending')">SET PENDING</button>
        <button class="btn winnerbtn" onclick="review('${esc(x.submission_id)}','winner')">🏆 WINNER</button>
        <button class="btn deletebtn" onclick="deleteEntry('${esc(x.submission_id)}')">DELETE</button>
      </div>
    </div>`).join("");
}

async function review(id,action){
  const card=document.querySelector('[data-id="'+CSS.escape(id)+'"]');
  const body={
    submission_id:id,
    action,
    review_note:card.querySelector(".note").value,
    reward:card.querySelector(".reward").value,
    winner_reward:card.querySelector(".winnerreward").value,
    score:Number(card.querySelector(".score").value||0)
  };

  try{
    const r=await fetch("/api/rewards/admin/review",{
      method:"POST",
      headers:{"Content-Type":"application/json","X-Admin-Key":key()},
      body:JSON.stringify(body)
    });
    const j=await r.json();
    if(!r.ok)throw new Error(j.error||"Unable to update");

    const i=DATA.findIndex(x=>x.submission_id===id);
    if(i>=0)DATA[i]=j.item;
    render();
  }catch(e){
    alert(e.message);
  }
}


async function deleteEntry(id){
  if(!confirm("Delete this submission permanently?"))return;

  try{
    const r=await fetch("/api/rewards/admin/delete",{
      method:"POST",
      headers:{"Content-Type":"application/json","X-Admin-Key":key()},
      body:JSON.stringify({submission_id:id})
    });

    const j=await r.json();
    if(!r.ok)throw new Error(j.error||"Unable to delete");

    DATA=DATA.filter(x=>x.submission_id!==id);
    render();
  }catch(e){
    alert(e.message);
  }
}

function toLocalInput(timestamp){
  if(!timestamp)return "";
  const d=new Date(Number(timestamp));
  const pad=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes());
}

async function loadEventConfig(){
  if(!key()){alert("Enter the admin key first.");return}

  try{
    const r=await fetch("/api/rewards/admin/event",{
      headers:{"X-Admin-Key":key()},
      cache:"no-store"
    });

    const j=await r.json();
    if(!r.ok)throw new Error(j.error||"Unable to load countdown");

    $("countdownEnabled").checked=j.countdown_enabled===true;
    $("countdownTitleInput").value=j.countdown_title||"Event Starts Soon";
    $("countdownMessageInput").value=j.countdown_message||"";
    $("countdownStart").value=toLocalInput(j.start_at);
  }catch(e){
    alert(e.message);
  }
}

async function saveEventConfig(){
  if(!key()){alert("Enter the admin key first.");return}

  const raw=$("countdownStart").value;
  const startAt=raw?new Date(raw).getTime():0;

  try{
    const r=await fetch("/api/rewards/admin/event",{
      method:"POST",
      headers:{"Content-Type":"application/json","X-Admin-Key":key()},
      body:JSON.stringify({
        countdown_enabled:$("countdownEnabled").checked,
        countdown_title:$("countdownTitleInput").value,
        countdown_message:$("countdownMessageInput").value,
        start_at:startAt
      })
    });

    const j=await r.json();
    if(!r.ok)throw new Error(j.error||"Unable to save countdown");

    alert("Countdown settings saved.");
  }catch(e){
    alert(e.message);
  }
}

document.querySelectorAll(".filter").forEach(btn=>btn.onclick=()=>{
  document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
  FILTER=btn.dataset.filter;
  render();
});

$("loadBtn").onclick=loadEntries;
$("loadEventBtn").onclick=loadEventConfig;
$("saveEventBtn").onclick=saveEventConfig;
</script>
</body>
</html>
